          <input
            id="urlInput"
            type="url"
            placeholder="paste a YouTube or Spotify link…"
            autocomplete="off"
            spellcheck="false"
            autofocus
          />

          <button class="input-action" id="pasteBtn" aria-label="Paste" title="Paste from clipboard">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M8.17071 4C8.58254 2.83481 9.69378 2 11 2H13C14.3062 2 15.4175 2.83481 15.8293 4H17C18.6569 4 20 5.34315 20 7V19C20 20.6569 18.6569 22 17 22H7C5.34315 22 4 20.6569 4 19V7C4 5.34315 5.34315 4 7 4H8.17071ZM10 5V6H14V5C14 4.44772 13.5523 4 13 4H11C10.4477 4 10 4.44772 10 5Z" fill="currentColor"/></svg>
          </button>
        </div>

        <div class="preview-zone" id="previewZone">
          <!-- skeleton appears here while loading; preview card replaces it on load -->
        </div>

        <div class="notice" id="spotifyNotice" hidden>
          <span>Spotify is locked down, so audio comes from YouTube and is re-tagged with Spotify details and cover art.</span>
        </div>

        <div class="row">
          <div class="seg" role="tablist" aria-label="Format">
            <button class="seg-btn is-active" data-format="mp4" role="tab" aria-selected="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true"><path d="M9.57648 2.53365C7.57781 1.29918 5 2.73688 5 5.08605V18.914C5 21.2632 7.57781 22.7009 9.57648 21.4664L20.7705 14.5524C22.6686 13.3801 22.6686 10.6199 20.7705 9.44763L9.57648 2.53365Z" fill="currentColor"/></svg>
              <span>MP4 video</span>
            </button>
            <button class="seg-btn" data-format="mp3" role="tab" aria-selected="false">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true"><path d="M5 12C5 8.13401 8.13401 5 12 5C15.866 5 19 8.13401 19 12V13H18C16.3431 13 15 14.3431 15 16V18C15 19.6569 16.3431 21 18 21C19.6569 21 21 19.6569 21 18V12C21 7.36745 17.5 3.55237 13 3.05493V3H12C7.02944 3 3 7.02944 3 12V18C3 19.6569 4.34315 21 6 21C7.65685 21 9 19.6569 9 18V16C9 14.3431 7.65685 13 6 13H5V12Z" fill="currentColor"/></svg>
              <span>MP3 audio</span>
            </button>
          </div>

          <div class="select-wrap">
            <label class="label" for="qualitySelect">Quality</label>
            <select id="qualitySelect" class="select"></select>
          </div>
        </div>

        <details class="advanced">
          <summary>
            <span>Advanced</span>
            <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M10.5858 13.9999C11.3668 14.781 12.6332 14.781 13.4142 13.9999L16.7071 10.707C17.0976 10.3165 17.0976 9.68332 16.7071 9.2928C16.3166 8.90228 15.6834 8.90228 15.2929 9.2928L12 12.5857L8.70711 9.2928C8.31658 8.90228 7.68342 8.90228 7.29289 9.2928C6.90237 9.68332 6.90237 10.3165 7.29289 10.707L10.5858 13.9999Z" fill="currentColor"/></svg>
          </summary>
          <div class="advanced-grid">
            <label class="check">
              <input type="checkbox" id="optThumbnail" />
              <span class="check-box"></span>
              <span class="check-label">
                <span>Embed thumbnail</span>
                <span class="check-hint">Saves cover art into the file</span>
              </span>
            </label>
            <label class="check">
              <input type="checkbox" id="optMetadata" checked />
              <span class="check-box"></span>
              <span class="check-label">
                <span>Embed metadata</span>
                <span class="check-hint">Title, uploader, upload date, etc.</span>
              </span>
            </label>
            <label class="check" id="optSubsWrap">
              <input type="checkbox" id="optSubs" />
              <span class="check-box"></span>
              <span class="check-label">
                <span>Embed subtitles</span>
                <span class="check-hint">English subs, MP4 only</span>
              </span>
            </label>
          </div>
        </details>

        <button class="btn-primary" id="downloadBtn">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M7 2H12V7C12 8.65685 13.3431 10 15 10H20V19C20 20.6569 18.6569 22 17 22H7C5.34315 22 4 20.6569 4 19V5C4 3.34315 5.34315 2 7 2ZM15.2071 17.2071L12.7071 19.7071C12.3166 20.0976 11.6834 20.0976 11.2929 19.7071L8.79289 17.2071C8.40237 16.8166 8.40237 16.1834 8.79289 15.7929C9.18342 15.4024 9.81658 15.4024 10.2071 15.7929L11 16.5858V13C11 12.4477 11.4477 12 12 12C12.5523 12 13 12.4477 13 13V16.5858L13.7929 15.7929C14.1834 15.4024 14.8166 15.4024 15.2071 15.7929C15.5976 16.1834 15.5976 16.8166 15.2071 17.2071Z" fill="currentColor"/><path d="M14 2.58579L19.4142 8H15C14.4477 8 14 7.55228 14 7V2.58579Z" fill="currentColor"/></svg>
          </span>
          <span class="btn-label">Download</span>
          <span class="btn-shortcut"><kbd>⏎</kbd></span>
        </button>
      </section>

      <section class="card jobs-card" id="jobsCard" hidden>
        <div class="card-head">
          <h2>Active</h2>
          <span class="muted-count" id="jobsCount"></span>
        </div>
        <ul class="jobs" id="jobsList"></ul>
      </section>

      <section class="card history-card" id="historyCard" hidden>
        <div class="card-head">
          <h2>Recent</h2>
          <span class="muted-count" id="historyCount"></span>
        </div>
        <ul class="history" id="historyList"></ul>
      </section>

      <section class="empty-state" id="emptyState">
        <p>Nothing downloaded yet.</p>
      </section>

      <footer class="footer">
        <span id="footerStatus">checking…</span>
        <span class="dot">·</span>
        <span>files saved to <code>./downloads</code></span>
      </footer>
    </main>

    <div class="toast-stack" id="toastStack" aria-live="polite"></div>

    <!-- popover menu (cloned per row) -->
    <template id="rowMenuTpl">
      <div class="row-menu">
        <button data-action="open"><span>Open</span></button>
        <button data-action="reveal"><span>Show in Finder</span></button>
        <button data-action="save"><span>Save a copy</span></button>
        <button data-action="copy"><span>Copy original URL</span></button>
        <button data-action="replay"><span>Download again</span></button>
        <div class="row-menu-divider"></div>
        <button data-action="delete" class="danger"><span>Delete file</span></button>
      </div>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
